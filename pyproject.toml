[project]
name = "habeas-corpus"
version = "0.2.0"
description = "Habeas Corpus — Adaptive Judicial Knowledge Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=23.0",
    "click>=8.4.2",
    "easyocr>=1.7.2",
    "faiss-cpu>=1.8.0",
    "fastapi>=0.115",
    "google-genai>=2.16.0",
    "httpx>=0.27",
    "neo4j>=6.2.0",
    "numpy>=2.5.1",
    "opencv-python>=5.0.0.93",
    "paddleocr>=2.10.0",
    "pillow>=12.3.0",
    "pydantic>=2.7",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=3.0.0",
    "spacy>=3.8.13",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
include = ["api*", "extractor*", "graph*", "ocr*", "query_understanding*", "reasoning*", "retrieval*", "semantic_retrieval*", "evidence*", "feedback*", "knowledge_acquisition*"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
